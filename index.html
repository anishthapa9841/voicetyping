<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voicetyping</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50">

    <!-- Header -->
    <header class="w-full border-b border-gray-200 bg-white shadow-sm">
        <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">

            <!-- Logo and Title -->
            <a href="/" class="flex items-center gap-3">
                <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-600 text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M12 2v20m-4-6V8a4 4 0 118 0v8a4 4 0 01-8 0zM5 11v2a7 7 0 0014 0v-2" />
                    </svg>
                </div>

                <span class="text-xl font-bold tracking-tight text-gray-900">
                    Voicetyping
                </span>
            </a>

            <!-- Navigation -->
            <nav class="hidden items-center gap-8 md:flex">
                <a href="#features" class="text-sm font-medium text-gray-600 transition hover:text-indigo-600">
                    Features
                </a>
                <a href="#how-it-works" class="text-sm font-medium text-gray-600 transition hover:text-indigo-600">
                    How It Works
                </a>
                <a href="#about" class="text-sm font-medium text-gray-600 transition hover:text-indigo-600">
                    About
                </a>
            </nav>

            <!-- Get Started Button -->
            <a href="#start"
                class="rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                Get Started
            </a>

        </div>
    </header>

    <!-- Main Content -->
    <main class="mx-auto max-w-7xl px-4 py-16 text-center sm:px-6 lg:px-8">
        <h1 class="text-4xl font-extrabold tracking-tight text-gray-900 sm:text-5xl">
            Voice Typing Made Simple
        </h1>

        <p class="mx-auto mt-4 max-w-2xl text-lg text-gray-600">
            Turn your voice into text instantly. Speak naturally and let
            Voicetyping do the typing for you.
        </p>

        <div class="mt-8">
            <a href="#start"
                class="inline-flex items-center gap-2 rounded-xl bg-indigo-600 px-6 py-3 font-semibold text-white shadow-lg transition hover:bg-indigo-700">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 2v12m-4-4a4 4 0 108 0V6a4 4 0 00-8 0v4zM5 11v1a7 7 0 0014 0v-1" />
                </svg>
                Start Voice Typing
            </a>
        </div>
    </main>

</body>

</html>
